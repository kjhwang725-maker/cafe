# Secrets: ECOS_API_KEY (필수), REB_API_KEY (선택·한국부동산원 R-ONE)
name: Update Dashboard

on:
  schedule:
    # 매일 한국시간 09:00 (KST = UTC+9 → GitHub cron은 UTC 기준 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch: # GitHub UI에서 수동 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: REB API 키를 config/reb_api.json에 병합 (선택)
        env:
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: |
          python3 << 'PY'
          import json, os
          k = os.environ.get("REB_API_KEY", "").strip()
          if not k:
              print("REB_API_KEY 비어 있음 — 한국은행.md·reb_api.json 로컬과 동일하게 쓰려면 Secrets에 등록")
              raise SystemExit(0)
          p = "config/reb_api.json"
          cfg = {"api_key": k, "tables": {}}
          if os.path.isfile(p):
              with open(p, encoding="utf-8") as f:
                  cfg = json.load(f)
              cfg["api_key"] = k
          os.makedirs("config", exist_ok=True)
          with open(p, "w", encoding="utf-8") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print("config/reb_api.json api_key 반영됨")
          PY

      - name: 전광판 데이터·페이지 생성
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: python scripts/generate_dashboard.py

      - name: index 화면 캡처 → docs/ticker.png
        run: |
          python -m playwright install chromium --with-deps
          python scripts/capture_ticker.py

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 저장소에 data.json·ticker.png 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/ticker.png
          if git diff --staged --quiet; then
            echo "data.json / ticker.png 변경 없음"
          else
            git commit -m "chore: data.json & ticker.png $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
