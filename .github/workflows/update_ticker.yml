# Secrets: ECOS_API_KEY (필수), REB_API_KEY (선택·한국부동산원 R-ONE)
name: Update Dashboard

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC = 한국 09:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 데이터·ticker·아티팩트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: REB API 키 병합 (선택)
        env:
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: |
          python3 << 'PY'
          import json, os
          k = os.environ.get("REB_API_KEY", "").strip()
          if not k:
              print("REB_API_KEY 비어 있음 — 스킵")
              raise SystemExit(0)
          p = "config/reb_api.json"
          cfg = {"api_key": k, "tables": {}}
          if os.path.isfile(p):
              with open(p, encoding="utf-8") as f:
                  cfg = json.load(f)
              cfg["api_key"] = k
          os.makedirs("config", exist_ok=True)
          with open(p, "w", encoding="utf-8") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print("config/reb_api.json api_key 반영됨")
          PY

      - name: 전광판 데이터 생성
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: python scripts/generate_dashboard.py

      - name: index 캡처 → ticker.png
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps
          python scripts/capture_ticker.py --wait-ms 4000

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 저장소에 data.json·ticker.png 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/ticker.png
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: data.json & ticker.png $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

  deploy:
    name: GitHub Pages 배포
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
