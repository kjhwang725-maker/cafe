name: Update Ticker

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 자동 실행
  workflow_dispatch:           # GitHub UI에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 한글 폰트 설치
        run: sudo apt-get install -y fonts-noto-cjk

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 전광판 이미지 생성
        run: python scripts/generate_ticker.py

      - name: GitHub Pages 배포용 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ticker.png
          git diff --staged --quiet || git commit -m "chore: ticker $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
