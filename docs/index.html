<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네이버카페 공간시장</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -0.02em; 
    background-color: #f8fafc;
    line-height: 1.6;
  }
  .fixed-container {
    width: 836px;
    max-width: 100%;
    margin: 0 auto;
    padding: 40px 20px; 
  }
  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .animate-spin-slow {
    animation: spin-slow 10s linear infinite;
  }
  .kr-rate-trend-icon {
    width: 1rem;
    height: 1rem;
    stroke-width: 2px;
  }
</style>
</head>
<body class="text-slate-800 text-sm">
<div class="fixed-container">
  <header class="mb-10 flex items-center justify-between gap-4">
    <div class="flex items-center gap-5">
      <div class="bg-[#03c75a] p-4 rounded-2xl shadow-lg shadow-[#03c75a]/30 flex items-center justify-center" title="네이버 카페">
        <!-- 네이버 카페 앱 아이콘 스타일: 초록 배경 위 흰 컵 + 스팀 실루엣 -->
        <svg class="w-8 h-8 shrink-0" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네이버 카페">
          <rect x="10.2" y="5" width="2.6" height="5.2" rx="1.3" fill="#fff" />
          <rect x="14.7" y="4" width="2.6" height="6.2" rx="1.3" fill="#fff" />
          <rect x="19.2" y="5" width="2.6" height="5.2" rx="1.3" fill="#fff" />
          <path
            fill="#fff"
            d="M9.5 14.8h13a1.5 1.5 0 011.5 1.5v4.6a5.6 5.6 0 01-5.6 5.6h-4.8a5.6 5.6 0 01-5.6-5.6v-4.6a1.5 1.5 0 011.5-1.5z"
          />
          <path fill="#fff" d="M23 16h2.6a3.4 3.4 0 110 6.8H23V16z" />
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-2 text-[#03c75a] font-bold tracking-[0.1em] text-xs uppercase mb-1">
          <i data-lucide="activity" class="w-4 h-4"></i>
          Space Market Intelligence
        </div>
        <h1 class="text-3xl font-black tracking-tight text-slate-900">
          네이버카페 공간시장
        </h1>
        <p class="text-slate-500 mt-1 flex items-center gap-1.5 text-sm font-medium">
          디벨로퍼 '부동산 관련' 종합 빅데이터 포럼으로
        </p>
      </div>
    </div>
    <div class="flex flex-col items-end justify-center text-right gap-0.5 bg-white/80 backdrop-blur px-5 py-3 rounded-2xl shadow-sm border border-slate-200 min-w-0">
      <div class="text-xs font-black text-[#03c75a] tracking-wide">최종 업데이트일</div>
      <div id="generated" class="text-sm font-bold text-slate-600 tabular-nums">데이터 로드 중…</div>
    </div>
  </header>

  <div id="error" class="mb-6 rounded-2xl border border-red-200 bg-red-50 px-5 py-4 text-sm text-red-800 shadow-sm" style="display:none;"></div>

  <div class="mb-10 space-y-5">
    <div id="finance-row-rates" class="grid min-w-0 grid-cols-3 gap-5 max-[1000px]:grid-cols-1"></div>
    <div id="finance-row-market" class="w-full min-w-0"></div>
  </div>

  <main class="space-y-6">
    <div class="flex items-center mb-4 border-b-2 border-slate-200 pb-5">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-blue-100/70 rounded-xl">
          <i data-lucide="home" class="text-blue-600 w-6 h-6"></i>
        </div>
        <h2 class="text-xl font-black tracking-tight text-slate-900">부동산 마켓 분석</h2>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-6 max-[900px]:grid-cols-1">
      <div class="col-span-2 bg-white rounded-2xl p-7 shadow-[0_4px_16px_-4px_rgba(0,0,0,0.04)] border border-slate-200 relative max-[900px]:col-span-1">
        <div class="mb-6">
          <h3 class="font-extrabold text-lg text-slate-900 mb-1">아파트 매매가격지수 (월간)</h3>
          <p class="text-xs text-slate-400 font-medium empty:hidden" id="housing-note"></p>
        </div>
        <div id="housing-chart-wrap" class="relative w-full min-h-[14rem] overflow-visible">
          <div class="relative min-h-[14rem] h-64 w-full pl-2 pr-4 sm:pr-6">
            <canvas id="housingChart"></canvas>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-7 shadow-[0_4px_16px_-4px_rgba(0,0,0,0.04)] border border-slate-200">
        <h3 class="font-extrabold text-lg text-slate-900 mb-1">매매수급동향(아파트)</h3>
        <p class="text-xs text-slate-400 font-medium mb-8" id="sd-hint">100 미만: 매수자 우위 · 지역별 최신</p>
        <div id="supply-demand-list" class="space-y-6"></div>
      </div>

      <div class="col-span-3 grid grid-cols-2 gap-6 max-[900px]:col-span-1 max-[900px]:grid-cols-1">
        <div class="bg-white rounded-2xl p-7 border border-slate-200 shadow-[0_4px_16px_-4px_rgba(0,0,0,0.04)]">
          <h3 class="font-extrabold text-base text-slate-900 mb-6 flex items-center gap-2.5">
            <div class="p-1.5 bg-purple-100 rounded-lg"><i data-lucide="building-2" class="text-purple-600 w-4 h-4"></i></div> 상업용 부동산 공실률 (%)
          </h3>
          <div id="rone-vacancy-wrap" class="relative w-full min-h-[11rem] overflow-visible"></div>
        </div>
        <div class="bg-white rounded-2xl p-7 border border-slate-200 shadow-[0_4px_16px_-4px_rgba(0,0,0,0.04)]">
          <h3 class="font-extrabold text-base text-slate-900 mb-6 flex items-center gap-2.5">
            <div class="p-1.5 bg-emerald-100 rounded-lg"><i data-lucide="pie-chart" class="text-emerald-600 w-4 h-4"></i></div> 부동산 투자수익률 (%)
          </h3>
          <div id="rone-inv-wrap" class="relative w-full min-h-[11rem] overflow-visible"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-sm font-semibold text-slate-400 tracking-tight pt-10 pb-6 mt-2 border-t border-slate-200/80">
    네이버 카페 공간시장
  </footer>
</div>

<script>
(function () {
  if (typeof Chart !== "undefined" && typeof ChartDataLabels !== "undefined") {
    Chart.register(ChartDataLabels);
  }

  var CHART_TEXT = "#475569";
  var CHART_GRID = "#e2e8f0";
  var CHART_MUTED = "#64748b";

  function sampleShow(i, len) {
    if (len <= 10) return true;
    if (len <= 24) return i % 2 === 0 || i === len - 1;
    if (len <= 48) return i % 3 === 0 || i >= len - 2;
    var step = Math.max(1, Math.floor(len / 14));
    return i % step === 0 || i >= len - 1;
  }

  function dlStroke() {
    return { textStrokeColor: "#ffffff", textStrokeWidth: 2 };
  }

  function safeParsedY(ctx) {
    if (!ctx) return null;
    if (ctx.parsed) {
      if (ctx.parsed.y !== undefined && ctx.parsed.y !== null) return ctx.parsed.y;
      if (ctx.parsed.x !== undefined && ctx.parsed.x !== null) return ctx.parsed.x;
    }
    if (ctx.dataset && ctx.dataset.data && ctx.dataIndex !== undefined) {
      var r = ctx.dataset.data[ctx.dataIndex];
      if (r !== undefined && r !== null) return r;
    }
    return null;
  }

  var REB_OPENAPI_STAT_SEARCH = "https://www.reb.or.kr/r-one/portal/openapi/openApiGuideCdPage.do";
  function linkRebStatSearch(label) {
    label = label || "통계코드 검색(R-ONE)";
    return (
      '<a href="' +
      REB_OPENAPI_STAT_SEARCH +
      '" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline font-medium">' +
      esc(label) +
      "</a>"
    );
  }

  function esc(s) {
    if (s == null) return "";
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  /** 미국·일본 금리: data.json의 rate_decimals와 무관하게 소수 둘째 자리까지 표시 */
  function seriesRate2Decimals(orig) {
    if (!orig || typeof orig !== "object") return orig;
    return Object.assign({}, orig, { rate_decimals: 2 });
  }

  function yyDotMmFromTime(t) {
    if (!t || t.length < 6) return "";
    var y = t.slice(0, 4);
    var m = t.slice(4, 6);
    return "'" + y.slice(2) + "." + m;
  }

  function krRateChangeLine(delta_pp) {
    if (delta_pp == null || delta_pp === "") {
      return (
        '<div class="mt-1 flex items-center justify-end gap-1 text-sm font-medium text-slate-400">' +
        '<i data-lucide="activity" class="kr-rate-trend-icon shrink-0 text-slate-400"></i>' +
        "<span>—</span></div>"
      );
    }
    var dn = Number(delta_pp);
    if (isNaN(dn)) {
      return (
        '<div class="mt-1 flex items-center justify-end gap-1 text-sm font-medium text-slate-400">' +
        '<i data-lucide="activity" class="kr-rate-trend-icon shrink-0 text-slate-400"></i>' +
        "<span>—</span></div>"
      );
    }
    if (Math.abs(dn) < 1e-9) {
      return (
        '<div class="mt-1 flex items-center justify-end gap-1 text-sm font-medium text-slate-400">' +
        '<i data-lucide="activity" class="kr-rate-trend-icon shrink-0 text-slate-400"></i>' +
        "<span>~ 0.00</span></div>"
      );
    }
    if (dn > 0) {
      return (
        '<div class="mt-1 flex items-center justify-end gap-1 text-sm font-semibold">' +
        '<i data-lucide="trending-up" class="kr-rate-trend-icon shrink-0 text-red-600"></i>' +
        '<span class="text-red-600">+' +
        Math.abs(dn).toFixed(2) +
        "</span></div>"
      );
    }
    return (
      '<div class="mt-1 flex items-center justify-end gap-1 text-sm font-semibold">' +
      '<i data-lucide="trending-down" class="kr-rate-trend-icon shrink-0 text-blue-600"></i>' +
      '<span class="text-blue-600">' +
      dn.toFixed(2) +
      "</span></div>"
    );
  }

  function krRateRowHtml(label, s) {
    if (!s || s.value == null) {
      return (
        '<div class="flex justify-between gap-4">' +
          '<span class="text-sm font-semibold text-slate-800">' +
          esc(label) +
          "</span>" +
          '<span class="text-sm text-slate-400">—</span>' +
          "</div>"
      );
    }
    var dt = yyDotMmFromTime(s.time);
    var val = parseFloat(String(s.value).replace(/\s/g, "").replace(/,/g, ""));
    if (isNaN(val)) {
      return (
        '<div class="flex justify-between gap-4">' +
          '<span class="text-sm font-semibold text-slate-800">' +
          esc(label) +
          "</span>" +
          '<span class="text-sm text-slate-600">' +
          esc(String(s.value)) +
          "</span></div>"
      );
    }
    var left =
      '<div class="min-w-0 pr-2">' +
      '<div class="text-sm font-bold leading-tight text-slate-800">' +
      esc(label) +
      "</div>" +
      (dt ? '<div class="mt-1 text-xs font-medium text-slate-500">' + esc("(" + dt + ")") + "</div>" : "") +
      "</div>";
    var right =
      '<div class="flex shrink-0 flex-col items-end tabular-nums">' +
      '<div class="text-2xl font-black leading-none tracking-tight text-slate-900">' +
      val.toFixed(s.rate_decimals != null && s.rate_decimals !== "" ? Number(s.rate_decimals) : 2) +
      '<span class="ml-0.5 text-base font-bold text-slate-500">%</span>' +
      "</div>" +
      krRateChangeLine(s.delta_pp) +
      "</div>";
    return (
      '<div class="flex w-full min-w-0 items-start justify-between gap-3">' +
      left +
      right +
      "</div>"
    );
  }

  /** 환율·지수·원화 등: 동일 좌우 레이아웃, 단위는 % 외 */
  function financeRowMetricHtml(label, s) {
    if (!s || s.value == null) {
      return (
        '<div class="flex justify-between gap-4">' +
          '<span class="text-sm font-semibold text-slate-800">' +
          esc(label) +
          "</span>" +
          '<span class="text-sm text-slate-400">—</span>' +
          "</div>"
      );
    }
    var dt = yyDotMmFromTime(s.time);
    var u = String(s.unit || "").trim();
    if (u === "2020=100") u = "";
    var v = s.value;
    var mainNum =
      typeof v === "number"
        ? v.toLocaleString("ko-KR", { maximumFractionDigits: 2 })
        : esc(String(v).replace(/\s/g, ","));
    var left =
      '<div class="min-w-0 pr-2">' +
      '<div class="text-sm font-bold leading-tight text-slate-800">' +
      esc(label) +
      "</div>" +
      (dt ? '<div class="mt-1 text-xs font-medium text-slate-500">' + esc("(" + dt + ")") + "</div>" : "") +
      "</div>";
    var sub =
      s.market_sub && String(s.market_sub).trim()
        ? '<div class="mt-1 max-w-[16rem] text-right text-xs font-medium text-slate-500">' + esc(s.market_sub) + "</div>"
        : '<div class="mt-1">' + krRateChangeLine(s.delta_pp) + "</div>";
    var right =
      '<div class="flex shrink-0 flex-col items-end tabular-nums">' +
      '<div class="text-2xl font-black leading-none tracking-tight text-slate-900">' +
      mainNum +
      (u
        ? '<span class="ml-1 text-sm font-bold leading-tight text-slate-500">' + esc(u) + "</span>"
        : "") +
      "</div>" +
      sub +
      "</div>";
    return (
      '<div class="flex w-full min-w-0 items-start justify-between gap-3">' +
      left +
      right +
      "</div>"
    );
  }

  function financeRowUnified(label, s) {
    if (!s || s.value == null) {
      return krRateRowHtml(label, s);
    }
    if (String(s.unit || "").trim() === "%") {
      return krRateRowHtml(label, s);
    }
    return financeRowMetricHtml(label, s);
  }

  /** 한국·미국·일본 금리·시장 지표 공통 카드. innerClass: 시장 지표 등에서 2열 그리드용 */
  function financeSectionRates(title, icon, colorClass, rowDefs, innerClass) {
    innerClass = innerClass || "space-y-6";
    var inner = rowDefs
      .map(function (def) {
        return financeRowUnified(def.label, def.s);
      })
      .join("");
    return (
      '<div class="min-w-0 bg-white rounded-2xl p-6 shadow-[0_4px_16px_-4px_rgba(0,0,0,0.04)] border border-slate-200">' +
        '<div class="flex items-center gap-3 mb-6">' +
        '<div class="p-2.5 rounded-xl ' +
        colorClass +
        ' shadow-sm">' +
        '<i data-lucide="' +
        esc(icon) +
        '" class="text-white w-5 h-5"></i>' +
        "</div>" +
        '<h3 class="font-extrabold text-slate-900 text-base">' +
        esc(title) +
        "</h3>" +
        "</div>" +
        '<div class="' +
        innerClass +
        '">' +
        inner +
        "</div>" +
        "</div>"
    );
  }

  /** ECOS 월간 YYYYMM → 축 표기 '25.03 */
  function labelYmToShortDot(ym) {
    var d = String(ym == null ? "" : ym).replace(/\D/g, "");
    if (d.length >= 6) return yyDotMmFromTime(d.slice(0, 6));
    return String(ym || "");
  }

  /** 월간 아파트 지수: 최근 years년분량 — 월별 점 기준 years×12개 (서울·경기 또는 구형 sale/lease) */
  function housingEcosLastYears(he, years) {
    years = years == null ? 2 : years;
    var labels = he.labels || [];
    var maxPts = Math.max(1, Math.floor(years * 12));
    var start = Math.max(0, labels.length - maxPts);
    var base = { labels: labels.slice(start), unit: he.unit };
    if (Array.isArray(he.seoul) && he.seoul.length === labels.length) {
      base.seoul = he.seoul.slice(start);
      base.gyeonggi = (he.gyeonggi || []).slice(start);
      return base;
    }
    base.sale = (he.sale || []).slice(start);
    base.lease = (he.lease || []).slice(start);
    return base;
  }

  /** 매매수급: 라벨에서 YYYYMM 추출, 동일 월은 마지막 행 채택 후 최근 n개월만 */
  function supplyDemandRecentMonths(labels, values, n) {
    n = n == null ? 3 : n;
    var byMonth = {};
    for (var i = 0; i < (labels || []).length; i++) {
      var lab = String(labels[i]);
      var digits = lab.replace(/\D/g, "");
      if (digits.length < 6) continue;
      var mk = digits.slice(0, 6);
      byMonth[mk] = { lab: lab, val: values[i] };
    }
    var months = Object.keys(byMonth).sort();
    if (!months.length) {
      return { labels: labels || [], values: values || [] };
    }
    var tail = months.slice(-n);
    var outL = [];
    var outV = [];
    for (var j = 0; j < tail.length; j++) {
      var p = byMonth[tail[j]];
      outL.push(p.lab);
      outV.push(p.val);
    }
    return { labels: outL, values: outV };
  }

  function supplyDemandFmt2(v) {
    if (v == null || v === "") return "";
    var n = Number(v);
    if (isNaN(n)) return String(v);
    return n.toFixed(2);
  }

  /** R-ONE 블록: 라벨·시리즈 끝에서 최근 n개 시점만 (월·분기 등 동일 길이 가정) */
  function sliceRoneDataLastN(block, n) {
    n = n == null ? 5 : n;
    var labels = block.labels || [];
    if (!labels.length) return block;
    var start = Math.max(0, labels.length - n);
    var out = Object.assign({}, block);
    out.labels = labels.slice(start);
    if (block.datasets && block.datasets.length) {
      out.datasets = block.datasets.map(function (d) {
        var x = Object.assign({}, d);
        x.data = (d.data || []).slice(start);
        return x;
      });
    } else if (block.values) {
      out.values = (block.values || []).slice(start);
    }
    return out;
  }

  /** 공실·투자수익 차트: 캔버스 + (다중 시리즈일 때) 한 줄 HTML 범례 */
  function setRoneLineWithOptionalLegend(wrapId, canvasId, legendItems) {
    var wrap = document.getElementById(wrapId);
    wrap.innerHTML = "";
    var chartBox = document.createElement("div");
    chartBox.className = "relative min-h-[10rem] h-44 w-full";
    var cv = document.createElement("canvas");
    cv.id = canvasId;
    chartBox.appendChild(cv);
    wrap.appendChild(chartBox);
    if (legendItems && legendItems.length > 1) {
      var leg = document.createElement("div");
      leg.className =
        "flex flex-nowrap justify-center items-center gap-x-4 gap-y-1 mt-2 text-[11px] font-semibold text-slate-600 overflow-x-auto pb-0.5";
      legendItems.forEach(function (item) {
        var span = document.createElement("span");
        span.className = "inline-flex items-center gap-1.5 shrink-0 whitespace-nowrap";
        var line = document.createElement("span");
        line.className = "inline-block w-3.5 h-0.5 rounded-sm";
        line.style.background = item.color || "#64748b";
        var lab = document.createElement("span");
        lab.textContent = item.label || "";
        span.appendChild(line);
        span.appendChild(lab);
        leg.appendChild(span);
      });
      wrap.appendChild(leg);
    }
    return cv.getContext("2d");
  }

  /** 공실률·투자수익 하단 범례와 동일 스타일(가는 선 + 라벨) */
  function appendLineLegendBelowChart(wrapId, items) {
    var wrap = document.getElementById(wrapId);
    if (!wrap || !items || !items.length) return;
    var prev = wrap.querySelector(".js-line-legend");
    if (prev) prev.remove();
    var leg = document.createElement("div");
    leg.className =
      "js-line-legend flex flex-nowrap justify-center items-center gap-x-4 gap-y-1 mt-2 text-[11px] font-semibold text-slate-600 overflow-x-auto pb-0.5";
    items.forEach(function (item) {
      var span = document.createElement("span");
      span.className = "inline-flex items-center gap-1.5 shrink-0 whitespace-nowrap";
      var line = document.createElement("span");
      line.className = "inline-block w-3.5 h-0.5 rounded-sm";
      line.style.background = item.color || "#64748b";
      var lab = document.createElement("span");
      lab.textContent = item.label != null ? String(item.label) : "";
      span.appendChild(line);
      span.appendChild(lab);
      leg.appendChild(span);
    });
    wrap.appendChild(leg);
  }

  function chartDefaults() {
    return {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: CHART_TEXT, font: { size: 12, family: "'Inter', sans-serif" } } },
      },
      scales: {
        x: {
          ticks: { color: CHART_MUTED, maxRotation: 45, minRotation: 0, autoSkip: true, font: { family: "'Inter', sans-serif" } },
          grid: { color: CHART_GRID },
        },
        y: {
          ticks: { color: CHART_MUTED, font: { family: "'Inter', sans-serif" } },
          grid: { color: CHART_GRID },
        },
      },
    };
  }

  fetch("data.json?v=" + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error("data.json 응답 오류 (" + r.status + ")");
      return r.json();
    })
    .then(function (data) {
      document.getElementById("error").style.display = "none";
      var s = data.series || {};
      var ga = data.generated_at || "";
      var datePart = ga.length >= 10 ? ga.slice(0, 10) : "";
      document.getElementById("generated").textContent =
        datePart ? datePart + " AM 09:00" : "—";

      var krRateDefs = [
        { label: "기준금리", s: s.kr_policy_rate },
        { label: "국고채 3년", s: s.kr_gov_3y },
        { label: "국고채 5년", s: s.kr_gov_5y },
      ];
      var usRateDefs = [
        { label: "기준금리", s: seriesRate2Decimals(s.us_policy) },
        { label: "단기금리(IR3TIB)", s: seriesRate2Decimals(s.us_short) },
        { label: "장기금리(IRLT)", s: seriesRate2Decimals(s.us_long) },
      ];
      var marketDefs = [
        { label: (s.fx_usd && s.fx_usd.label) || "원/달러(매매기준)", s: s.fx_usd },
        { label: (s.fx_jpy && s.fx_jpy.label) || "원/100엔(매매기준)", s: s.fx_jpy },
        { label: (s.fx_eur && s.fx_eur.label) || "원/유로(매매기준)", s: s.fx_eur },
        { label: (s.export_px && s.export_px.label) || "수출물가지수", s: s.export_px },
        { label: (s.ecb_rate && s.ecb_rate.label) || "ECB 정책금리(유로지역)", s: s.ecb_rate },
      ];

      var jpRateDefs = [
        { label: "기준금리", s: seriesRate2Decimals(s.jp_policy) },
        { label: "장기금리(IRLT)", s: seriesRate2Decimals(s.jp_long) },
      ];

      document.getElementById("finance-row-rates").innerHTML =
        financeSectionRates("한국 금리", "globe", "bg-blue-600", krRateDefs) +
        financeSectionRates("미국 금리", "dollar-sign", "bg-indigo-600", usRateDefs) +
        financeSectionRates("일본 금리", "coins", "bg-teal-600", jpRateDefs);

      document.getElementById("finance-row-market").innerHTML = financeSectionRates(
        "시장 지표",
        "activity",
        "bg-rose-500",
        marketDefs,
        "grid grid-cols-2 gap-x-10 gap-y-8 max-[720px]:grid-cols-1"
      );

      var he = data.housing_ecos || {};
      var housingNoteEl = document.getElementById("housing-note");
      housingNoteEl.textContent = "";
      var heWin = housingEcosLastYears(he, 2);
      var hLabels = (heWin.labels || []).map(labelYmToShortDot);
      var useHousingRegions =
        Array.isArray(heWin.seoul) && heWin.seoul.length === (heWin.labels || []).length;
      if (!hLabels.length) {
        housingNoteEl.textContent = "주택 지수 데이터 없음";
      }
      var housingDatasets = useHousingRegions
        ? [
            {
              label: "서울",
              data: heWin.seoul || [],
              borderColor: "#4f46e5",
              backgroundColor: "rgba(79, 70, 229, 0.08)",
              borderWidth: 2.5,
              tension: 0.3,
              pointRadius: 0,
            },
            {
              label: "경기",
              data: heWin.gyeonggi || [],
              borderColor: "#ea580c",
              backgroundColor: "rgba(234, 88, 12, 0.08)",
              borderWidth: 2.5,
              tension: 0.3,
              pointRadius: 0,
            },
          ]
        : [
            {
              label: "매매 (아파트·전국)",
              data: heWin.sale || [],
              borderColor: "#2563eb",
              backgroundColor: "rgba(37, 99, 235, 0.08)",
              borderWidth: 2.5,
              tension: 0.3,
              pointRadius: 0,
            },
            {
              label: "전세 (아파트·전국)",
              data: heWin.lease || [],
              borderColor: "#10b981",
              backgroundColor: "rgba(16, 185, 129, 0.08)",
              borderWidth: 2.5,
              tension: 0.3,
              pointRadius: 0,
            },
          ];
      new Chart(document.getElementById("housingChart").getContext("2d"), {
        type: "line",
        data: {
          labels: hLabels,
          datasets: housingDatasets,
        },
        options: Object.assign({}, chartDefaults(), {
          layout: {
            padding: { top: 22, right: 36, bottom: 10, left: 10 },
          },
          plugins: {
            legend: { display: false },
            datalabels: Object.assign(
              {
                clip: false,
                display: function (ctx) {
                  var pv = safeParsedY(ctx);
                  if (pv == null || pv === "") return false;
                  return sampleShow(ctx.dataIndex, ctx.dataset.data.length);
                },
                color: function (ctx) {
                  if (useHousingRegions) {
                    return ["#4338ca", "#c2410c"][ctx.datasetIndex] || CHART_TEXT;
                  }
                  return ctx.datasetIndex === 0 ? "#1d4ed8" : "#047857";
                },
                font: { size: 10, weight: "700", family: "'Inter', sans-serif" },
                align: "top",
                offset: 4,
                formatter: function (v) {
                  return v != null && typeof v === "number" ? v.toFixed(1) : "";
                },
              },
              dlStroke()
            ),
            tooltip: {
              callbacks: {
                label: function (ctx) {
                  var v = safeParsedY(ctx);
                  if (v == null || v === "") return ctx.dataset.label + ": —";
                  return ctx.dataset.label + ": " + Number(v).toFixed(2) + " (" + (he.unit || "") + ")";
                },
              },
            },
          },
          scales: Object.assign({}, chartDefaults().scales, {
            x: Object.assign({}, chartDefaults().scales.x, {
              offset: true,
              ticks: Object.assign({}, chartDefaults().scales.x.ticks, { padding: 4 }),
            }),
            y: {
              grace: "10%",
              ticks: { color: CHART_MUTED, font: { family: "'Inter', sans-serif" } },
              grid: { color: CHART_GRID },
              title: { display: true, text: he.unit || "지수", color: CHART_MUTED, font: { family: "'Inter', sans-serif", size: 11 } },
            },
          }),
        }),
      });
      if (hLabels.length && housingDatasets.length) {
        appendLineLegendBelowChart(
          "housing-chart-wrap",
          housingDatasets.map(function (d) {
            return { label: d.label, color: d.borderColor };
          })
        );
      }

      var rone = data.rone || {};

      var sdEl = document.getElementById("supply-demand-list");
      var sdBar = rone.supply_demand_bar;
      if (sdBar && (sdBar.regions || []).length) {
        document.getElementById("sd-hint").textContent = "100 미만: 매수자 우위 · 지역별 최신";
        sdEl.innerHTML = sdBar.regions
          .map(function (row) {
            var lab = row.label || "";
            var v = row.value;
            var tim = row.time;
            var dt = "";
            if (tim) {
              var d6 = String(tim).replace(/\D/g, "").slice(0, 6);
              if (d6.length >= 6) dt = yyDotMmFromTime(d6);
            }
            var rightNum =
              v != null && v !== ""
                ? '<span class="text-blue-600 text-base font-black tabular-nums">' + esc(supplyDemandFmt2(v)) + "</span>"
                : '<span class="text-sm text-slate-400">—</span>';
            var barHtml =
              v != null && v !== ""
                ? '<div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden shadow-inner">' +
                  '<div class="h-full bg-blue-600 rounded-full" style="width:' +
                  Math.min(100, Math.max(0, v)) +
                  '%"></div></div>'
                : "";
            return (
              '<div>' +
                '<div class="flex justify-between items-start gap-3 mb-2">' +
                '<div class="min-w-0">' +
                '<div class="text-sm font-bold text-slate-700">' +
                esc(lab) +
                "</div>" +
                (dt
                  ? '<div class="mt-0.5 text-xs font-medium text-slate-500">' + esc("(" + dt + ")") + "</div>"
                  : "") +
                "</div>" +
                rightNum +
                "</div>" +
                barHtml +
                "</div>"
            );
          })
          .join("");
      } else if (sdBar && (sdBar.labels || []).length) {
        document.getElementById("sd-hint").textContent = "100 미만: 매수자 우위 · 최근 3개월";
        var sd = sdBar;
        var sd3 = supplyDemandRecentMonths(sd.labels, sd.values, 3);
        sdEl.innerHTML = sd3.labels
          .map(function (lab, i) {
            var v = sd3.values[i];
            if (v == null) return "";
            var w = Math.min(100, Math.max(0, v));
            return (
              '<div>' +
                '<div class="flex justify-between items-end mb-2 text-sm font-bold">' +
                '<span class="text-slate-700">' +
                esc(lab) +
                "</span>" +
                '<span class="text-blue-600 text-base font-black tabular-nums">' +
                esc(supplyDemandFmt2(v)) +
                "</span>" +
                "</div>" +
                '<div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden shadow-inner">' +
                '<div class="h-full bg-blue-600 rounded-full" style="width:' +
                w +
                '%"></div>' +
                "</div>" +
              "</div>"
            );
          })
          .join("");
      } else {
        sdEl.innerHTML =
          '<p class="text-sm text-slate-400 leading-relaxed">' +
          "수급 데이터 없음. " +
          linkRebStatSearch() +
          "에서 통계표코드(<code class=\"bg-slate-100 px-1.5 py-0.5 rounded text-xs\">STATBL_ID</code>) 확인 후 " +
          "<code class=\"bg-slate-100 px-1.5 py-0.5 rounded text-xs\">reb_api.json</code> → " +
          "<code class=\"bg-slate-100 px-1.5 py-0.5 rounded text-xs\">supply_demand</code>에 반영·갱신하세요." +
          "</p>";
      }

      function setRoneCanvas(wrapId, title, canvasId, chartOpts) {
        var wrap = document.getElementById(wrapId);
        wrap.innerHTML = "";
        var cv = document.createElement("canvas");
        cv.id = canvasId;
        wrap.appendChild(cv);
        return cv.getContext("2d");
      }

      if (rone.commercial_vacancy && (rone.commercial_vacancy.labels || []).length) {
        var cv = sliceRoneDataLastN(rone.commercial_vacancy, 5);
        var vacancyDatasets;
        if (cv.datasets && cv.datasets.length) {
          vacancyDatasets = cv.datasets.map(function (d, i) {
            return {
              label: d.label != null ? String(d.label) : "시리즈 " + (i + 1),
              data: d.data,
              borderColor: d.borderColor || "#9333ea",
              borderWidth: 2,
              tension: 0.3,
              pointRadius: 0,
            };
          });
        } else {
          vacancyDatasets = [
            { label: "공실률", data: cv.values, borderColor: "#9333ea", borderWidth: 2, tension: 0.3, pointRadius: 0 },
          ];
        }
        var vacLegend = vacancyDatasets.length > 1;
        var vacLegendItems = vacLegend
          ? vacancyDatasets.map(function (d) {
              return { label: d.label, color: d.borderColor || "#9333ea" };
            })
          : null;
        new Chart(setRoneLineWithOptionalLegend("rone-vacancy-wrap", "roneVac", vacLegendItems), {
          type: "line",
          data: { labels: cv.labels, datasets: vacancyDatasets },
          options: Object.assign({}, chartDefaults(), {
            layout: {
              padding: { top: 22, right: 10, bottom: 6, left: 4 },
            },
            plugins: {
              legend: { display: !vacLegend, labels: { color: CHART_TEXT, font: { size: 11, family: "'Inter', sans-serif" } } },
              datalabels: Object.assign(
                {
                  clip: false,
                  display: function (ctx) {
                    if (safeParsedY(ctx) == null) return false;
                    return sampleShow(ctx.dataIndex, ctx.dataset.data.length);
                  },
                  color: function (ctx) {
                    var c = ctx.dataset.borderColor;
                    return typeof c === "string" ? c : "#7e22ce";
                  },
                  font: { size: 10, weight: "700", family: "'Inter', sans-serif" },
                  align: "top",
                  offset: 4,
                  formatter: function (v) {
                    return v != null && typeof v === "number" ? v.toFixed(1) : "";
                  },
                },
                dlStroke()
              ),
            },
            scales: Object.assign({}, chartDefaults().scales, {
              y: Object.assign({}, chartDefaults().scales.y, {
                grace: "10%",
              }),
            }),
          }),
        });
      } else {
        document.getElementById("rone-vacancy-wrap").innerHTML =
          '<p class="text-sm text-slate-400 py-6 text-center leading-relaxed">' +
          "공실률 시계열 없음. " +
          linkRebStatSearch() +
          " → <code class=\"bg-slate-100 px-1.5 py-0.5 rounded text-xs\">commercial_vacancy</code>" +
          "</p>";
      }

      if (rone.investment_return && (rone.investment_return.labels || []).length) {
        var ir = sliceRoneDataLastN(rone.investment_return, 5);
        var invDatasets;
        if (ir.datasets && ir.datasets.length) {
          invDatasets = ir.datasets.map(function (d, i) {
            var c = d.borderColor || "#059669";
            return {
              label: d.label != null ? String(d.label) : "시리즈 " + (i + 1),
              data: d.data,
              borderColor: c,
              borderWidth: 2,
              tension: 0.3,
              pointRadius: 0,
            };
          });
        } else {
          invDatasets = [
            {
              label: "수익률",
              data: ir.values,
              borderColor: "#10b981",
              borderWidth: 2,
              tension: 0.3,
              pointRadius: 0,
            },
          ];
        }
        var invLegend = invDatasets.length > 1;
        var invLegendItems = invLegend
          ? invDatasets.map(function (d) {
              return { label: d.label, color: d.borderColor || "#059669" };
            })
          : null;
        new Chart(setRoneLineWithOptionalLegend("rone-inv-wrap", "roneInv", invLegendItems), {
          type: "line",
          data: { labels: ir.labels, datasets: invDatasets },
          options: Object.assign({}, chartDefaults(), {
            layout: {
              padding: { top: 22, right: 10, bottom: 6, left: 4 },
            },
            plugins: {
              legend: { display: !invLegend, labels: { color: CHART_TEXT, font: { size: 11, family: "'Inter', sans-serif" } } },
              datalabels: Object.assign(
                {
                  clip: false,
                  display: function (ctx) {
                    if (safeParsedY(ctx) == null) return false;
                    return sampleShow(ctx.dataIndex, ctx.dataset.data.length);
                  },
                  color: function (ctx) {
                    var c = ctx.dataset.borderColor;
                    return typeof c === "string" ? c : "#059669";
                  },
                  font: { size: 10, weight: "700", family: "'Inter', sans-serif" },
                  align: "top",
                  offset: 4,
                  formatter: function (v) {
                    return v != null && typeof v === "number" ? v.toFixed(1) : "";
                  },
                },
                dlStroke()
              ),
            },
            scales: Object.assign({}, chartDefaults().scales, {
              y: Object.assign({}, chartDefaults().scales.y, {
                grace: "10%",
              }),
            }),
          }),
        });
      } else {
        document.getElementById("rone-inv-wrap").innerHTML =
          '<p class="text-sm text-slate-400 py-6 text-center leading-relaxed">' +
          "투자수익률 없음. " +
          linkRebStatSearch() +
          " → <code class=\"bg-slate-100 px-1.5 py-0.5 rounded text-xs\">investment_return</code>" +
          "</p>";
      }

      if (typeof lucide !== "undefined") lucide.createIcons();
    })
    .catch(function (e) {
      var err = document.getElementById("error");
      err.style.display = "block";
      document.getElementById("generated").textContent = "";
      var detail = e && e.message ? String(e.message) : String(e);
      if (location.protocol === "file:") {
        err.className =
          "mb-6 rounded-2xl border border-amber-200 bg-amber-50 px-5 py-4 text-sm text-amber-950 shadow-sm";
        err.innerHTML =
          "<strong>로컬 파일로 연 상태입니다.</strong> 브라우저 보안 때문에 <code class=\"rounded bg-white/70 px-1.5 py-0.5 text-xs\">data.json</code>을 불러올 수 없습니다. " +
          "프로젝트 루트에서 터미널에 <code class=\"rounded bg-white/70 px-1.5 py-0.5 text-xs\">python serve_docs.py</code> 실행 후 " +
          "브라우저로 <strong>http://127.0.0.1:8765/index.html</strong> 을 여세요.";
      } else {
        err.className =
          "mb-6 rounded-2xl border border-red-200 bg-red-50 px-5 py-4 text-sm text-red-800 shadow-sm";
        err.textContent =
          "데이터를 불러오지 못했습니다. " + detail + " — docs/data.json 존재 여부와 주소가 /index.html 기준인지 확인하세요.";
      }
    });
})();
</script>
</body>
</html>
