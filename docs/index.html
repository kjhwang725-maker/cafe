<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
<title>부동산 개발 동반성장 연구소 — Korea-Plan</title>
<script>
(function () {
  try {
    if (location.protocol !== "http:" && location.protocol !== "https:") return;
    var u = new URL(location.href);
    if (!u.searchParams.has("_cb")) {
      u.searchParams.set("_cb", String(Date.now()));
      location.replace(u.toString());
    }
  } catch (e) {}
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --brand: #03c75a;
    --bg: #ffffff;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-2: #475569;
    --ink-3: #94a3b8;
    --up: #dc2626;
    --down: #2563eb;
    --flat: #94a3b8;
    --gold: #f59e0b;
    --border: #e5e9f2;
  }
  html, body { background: var(--bg); }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1.55;
  }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .fixed-container {
    width: 740px;
    max-width: 100%;
    margin: 0 auto;
    padding: 24px 18px 14px;
  }
  /* 캡처 대상 */
  #ticker-board { width: 100%; }

  /* ── 헤더 ─────────────────────────────────────── */
  .hero {
    position: relative;
    overflow: hidden;
    border-radius: 22px;
    padding: 22px 22px 20px;
    color: #fff;
    background:
      radial-gradient(120% 120% at 0% 0%, #1e293b 0%, #0f172a 55%, #020617 100%);
    box-shadow: 0 10px 30px -12px rgba(15,23,42,.4);
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 95% 0%, rgba(3,199,90,.18), transparent 40%),
      radial-gradient(circle at 0% 100%, rgba(96,165,250,.10), transparent 45%);
    pointer-events: none;
  }
  .hero-top {
    display: flex; align-items: center; gap: 14px; position: relative; z-index: 1;
  }
  .hero-logo {
    width: 48px; height: 48px; border-radius: 14px;
    background: var(--brand);
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px -6px rgba(3,199,90,.6);
    flex-shrink: 0;
  }
  .hero-title { font-size: 22px; font-weight: 800; line-height: 1.15; letter-spacing: -0.03em; }
  .hero-sub   { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 4px; font-weight: 500; }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 700;
    color: var(--brand);
    background: rgba(3,199,90,.12); padding: 3px 9px; border-radius: 999px;
    margin-bottom: 4px; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .hero-meta {
    margin-left: auto; text-align: right; position: relative; z-index: 1; flex-shrink: 0;
  }
  .hero-meta .l { font-size: 10px; font-weight: 700; color: rgba(255,255,255,.55); letter-spacing: .08em; text-transform: uppercase; }
  .hero-meta .v { font-size: 14px; font-weight: 700; color: #fff; margin-top: 2px; }
  .hero-meta .live { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; color: #4ade80; margin-top: 4px; }
  .hero-meta .live i { width: 6px; height: 6px; border-radius: 999px; background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.22); animation: pulse 1.8s infinite; display: inline-block; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* KPI 스트립 (헤더 하단) */
  .kpis {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px; margin-top: 14px; position: relative; z-index: 1;
  }
  .kpi {
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    padding: 10px 12px;
  }
  .kpi .name { font-size: 10.5px; color: rgba(255,255,255,.6); font-weight: 600; letter-spacing: 0.02em; }
  .kpi .val  { font-size: 20px; font-weight: 800; color: #fff; margin-top: 2px; line-height: 1.1; }
  .kpi .val .u { font-size: 11px; color: rgba(255,255,255,.5); font-weight: 600; margin-left: 2px; }
  .kpi .chg  { font-size: 11px; font-weight: 700; margin-top: 1px; }

  /* ── 카드 그리드 ───────────────────────────────── */
  .grid-2 {
    display: grid; gap: 12px; margin-top: 14px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px 16px 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,.03), 0 6px 18px -10px rgba(15,23,42,.08);
  }
  .card-head {
    display: flex; align-items: center; gap: 8px;
    margin: -2px -4px 8px;
    padding: 0 4px 9px;
    border-bottom: 1px dashed var(--border);
  }
  .card-head .ico {
    width: 26px; height: 26px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; flex-shrink: 0;
  }
  .card-head .ico i { width: 15px; height: 15px; stroke-width: 2.4; }
  .card-head .t { font-size: 13px; font-weight: 800; color: var(--ink); }
  .card-head .sub { font-size: 10.5px; color: var(--ink-3); margin-left: auto; font-weight: 600; }

  .ico.blue  { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
  .ico.green { background: linear-gradient(135deg, #059669, #047857); }
  .ico.amber { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .ico.rose  { background: linear-gradient(135deg, #f43f5e, #be123c); }
  .ico.violet{ background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
  .ico.teal  { background: linear-gradient(135deg, #14b8a6, #0f766e); }

  /* row */
  .row {
    display: grid;
    grid-template-columns: 1fr 64px auto;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid #f1f5f9;
  }
  .row:first-of-type { border-top: 0; padding-top: 4px; }
  .row .label { font-size: 12.5px; font-weight: 700; color: var(--ink); line-height: 1.25; white-space: pre-line; }
  .row .meta  { font-size: 10.5px; color: var(--ink-3); font-weight: 500; margin-top: 1px; }
  .row .spark { display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 1px; }
  .row .spark svg { width: 100%; height: 20px; display: block; }
  .row .spark .period { font-size: 7px; color: var(--ink-3); font-weight: 600; line-height: 1; letter-spacing: -0.03em; text-align: left; padding-left: 1px; }
  .row .right { display: flex; align-items: baseline; gap: 6px; }
  .row .val   { font-size: 17px; font-weight: 800; color: var(--ink); }
  .row .val .u { font-size: 10.5px; font-weight: 700; color: var(--ink-3); margin-left: 2px; }
  .row .chg   { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; min-width: 50px; text-align: center; }
  .chg.up   { color: var(--up);   background: rgba(220,38,38,.08); }
  .chg.down { color: var(--down); background: rgba(37,99,235,.08); }
  .chg.flat { color: var(--ink-3); background: rgba(148,163,184,.12); }
  /* KPI 스파크라인 */
  .kpi .kpi-spark { display:flex; flex-direction:column; gap:1px; margin-top: 4px; }
  .kpi .kpi-spark svg { width: 100%; height: 16px; display: block; }
  .kpi .kpi-spark .period { font-size: 7px; color: rgba(255,255,255,.45); font-weight: 600; line-height: 1; text-align: left; padding-left: 1px; letter-spacing: -0.03em; }

  /* error / empty */
  .err { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; font-size: 12.5px; }

  /* 푸터 */
  .footer { margin-top: 14px; text-align: center; font-size: 10.5px; color: var(--ink-3); font-weight: 600; letter-spacing: 0.02em; }
  .footer b { color: var(--brand); font-weight: 800; }

  /* 캡처 안정성: 폰트 로드 전 대체 폰트도 비슷한 크기 유지 */
  .font-fallback { font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
</style>
</head>

    <!-- ───── 헤더 ───── -->
    <div class="hero">

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  function esc(s) { if (s == null) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  function timeLabel(s) {
    if (!s || !s.time) return "";
    const t = String(s.time).replace(/\D/g, "");
    if (t.length >= 8 && /·일\s*$/.test(s.note || "")) return `'${t.slice(2,4)}.${t.slice(4,6)}.${t.slice(6,8)}`;
    if (t.length >= 6) return `'${t.slice(2,4)}.${t.slice(4,6)}`;
    return "";
  }
  function fmtNum(v, decimals) {
    if (v == null || v === "") return "—";
    const n = typeof v === "number" ? v : parseFloat(String(v).replace(/[\s,]/g, ""));
    if (isNaN(n)) return String(v);
    return n.toLocaleString("ko-KR", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  /**
   * 인라인 SVG 스파크라인. trend: "up" → 빨강, "down" → 파랑, "flat" → 회색.
   * w/h 는 viewBox 기준; CSS 가 폭 100% 늘림.
   */
  function sparkline(values, trend, w, h) {
    if (!Array.isArray(values) || values.length < 2) return "";
    w = w || 64; h = h || 22;
    const pad = 1.5;
    const min = Math.min.apply(null, values);
    const max = Math.max.apply(null, values);
    const range = (max - min) || 1;
    const step = (w - pad * 2) / (values.length - 1);
    const pts = values.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return x.toFixed(1) + "," + y.toFixed(1);
    });
    const stroke =
      trend === "up"   ? "#dc2626" :
      trend === "down" ? "#2563eb" : "#94a3b8";
    const fill =
      trend === "up"   ? "rgba(220,38,38,.10)" :
      trend === "down" ? "rgba(37,99,235,.10)" : "rgba(148,163,184,.10)";
    const linePath = "M" + pts.join(" L");
    const areaPath = linePath + ` L${(pad + (values.length - 1) * step).toFixed(1)},${(h - pad).toFixed(1)} L${pad},${(h - pad).toFixed(1)} Z`;
    const lastX = (pad + (values.length - 1) * step).toFixed(1);
    const lastY = (h - pad - ((values[values.length - 1] - min) / range) * (h - pad * 2)).toFixed(1);
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="${areaPath}" fill="${fill}" stroke="none"/>
      <path d="${linePath}" fill="none" stroke="${stroke}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${lastX}" cy="${lastY}" r="1.8" fill="${stroke}"/>
    </svg>`;
  }
  function trendOf(values) {
    if (!Array.isArray(values) || values.length < 2) return "flat";
    const a = values[0], b = values[values.length - 1];
    const diff = b - a;
    const scale = Math.max(Math.abs(a), Math.abs(b), 1e-6);
    if (Math.abs(diff) / scale < 0.001) return "flat";
    return diff > 0 ? "up" : "down";
  }
  /**
   * 스파크라인 색상 기준: 배지(▲▼)와 일치시키기 위해 delta_pp(직전 대비 변동) 부호를 우선 사용.
   * delta_pp 가 없는 항목(물가 등 배지 없는 지수)만 기간추세(trendOf)로 폴백한다.
   */
  function trendForSpark(s) {
    const d = s && s.delta_pp;
    if (d != null && d !== "" && !isNaN(Number(d))) {
      const n = Number(d);
      if (Math.abs(n) < 1e-9) return "flat";
      return n > 0 ? "up" : "down";
    }
    return trendOf(s && s.spark);
  }

  function chgBadge(d, asPct, decimals) {
    if (d == null || d === "" || isNaN(Number(d))) return `<span class="chg flat">—</span>`;
    const n = Number(d);
    if (Math.abs(n) < 1e-9) return `<span class="chg flat">~0.00${asPct ? "%p" : ""}</span>`;
    const dec = decimals != null ? decimals : 2;
    const sign = n > 0 ? "▲" : "▼";
    const cls  = n > 0 ? "up" : "down";
    // %p(금리)는 콤마 없이 소수만; 가격·지수 등은 toLocaleString 으로 천단위 콤마
    const abs = Math.abs(n);
    const numStr = asPct
      ? abs.toFixed(dec)
      : abs.toLocaleString("ko-KR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return `<span class="chg ${cls}">${sign} ${numStr}${asPct ? "%p" : ""}</span>`;
  }

  /** spark 길이 + note 의 ·월/·일 토큰으로 "최근 N개월" / "최근 N일" 자동 추론. */
  function sparkPeriodLabel(s) {
    if (!s || !Array.isArray(s.spark) || s.spark.length < 2) return "";
    const n = s.spark.length;
    const isDaily = /·일\s*$/.test(String(s.note || ""));
    return isDaily ? `${n}일` : `${n}개월`;
  }

  /** 차트(스파크라인) 아래 라벨: "기간 · 데이터날짜"(최신 시점). 데이터가 얼마나 최신인지 함께 표시. */
  function sparkFoot(s) {
    const period = sparkPeriodLabel(s);
    const date = timeLabel(s);
    return period && date ? `${period} · ${date}` : (period || date || "");
  }

  function sparkCell(s) {
    const spark = s && s.spark;
    if (!Array.isArray(spark) || spark.length < 2) {
      return `<div class="spark"></div>`;
    }
    return `<div class="spark">${sparkline(spark, trendForSpark(s))}<div class="period">${esc(sparkFoot(s))}</div></div>`;
  }

  function rateRow(label, s, decimals) {
    if (!s || s.value == null) {
      return `<div class="row"><div><div class="label">${esc(label)}</div></div><div class="spark"></div><div class="right"><span class="val">—</span></div></div>`;
    }
    const dec = decimals != null ? decimals : (s.rate_decimals != null ? Number(s.rate_decimals) : 2);
    const v = parseFloat(String(s.value).replace(/[\s,]/g, ""));
    const t = timeLabel(s);
    return `
      <div class="row">
        <div>
          <div class="label">${esc(label)}</div>
          ${t ? `<div class="meta">${esc(t)}</div>` : ""}
        </div>
        ${sparkCell(s)}
        <div class="right">
          <span class="val num">${isNaN(v) ? esc(s.value) : v.toFixed(dec)}<span class="u">%</span></span>
          ${chgBadge(s.delta_pp, true, dec)}
        </div>
      </div>`;
  }
  function fxRow(label, s, decimals) {
    if (!s || s.value == null) {
      return `<div class="row"><div><div class="label">${esc(label)}</div></div><div class="spark"></div><div class="right"><span class="val">—</span></div></div>`;
    }
    const dec = decimals != null ? decimals : 2;
    const v = parseFloat(String(s.value).replace(/[\s,]/g, ""));
    const t = timeLabel(s);
    return `
      <div class="row">
        <div>
          <div class="label">${esc(label)}</div>
          ${t ? `<div class="meta">${esc(t)}</div>` : ""}
        </div>
        ${sparkCell(s)}
        <div class="right">
          <span class="val num">${isNaN(v) ? esc(s.value) : v.toLocaleString("ko-KR", { minimumFractionDigits: dec, maximumFractionDigits: dec })}<span class="u">${esc(s.unit || "")}</span></span>
          ${chgBadge(s.delta_pp, false, dec)}
        </div>
      </div>`;
  }
  function idxRow(label, s) {
    if (!s || s.value == null) {
      return `<div class="row"><div><div class="label">${esc(label)}</div></div><div class="spark"></div><div class="right"><span class="val">—</span></div></div>`;
    }
    const v = parseFloat(String(s.value).replace(/[\s,]/g, ""));
    const t = timeLabel(s);
    const u = (s.unit && s.unit !== "2020=100") ? s.unit : "";
    return `
      <div class="row">
        <div>
          <div class="label">${esc(label)}</div>
          ${t ? `<div class="meta">${esc(t)}${s.unit === "2020=100" ? " · 2020=100" : ""}</div>` : ""}
        </div>
        ${sparkCell(s)}
        <div class="right">
          <span class="val num">${isNaN(v) ? esc(s.value) : v.toLocaleString("ko-KR", { maximumFractionDigits: 2 })}${u ? `<span class="u">${esc(u)}</span>` : ""}</span>
        </div>
      </div>`;
  }

  function cardHead(icoCls, ico, title, sub) {
    return `<div class="card-head">
      <span class="ico ${icoCls}"><i data-lucide="${esc(ico)}"></i></span>
      <span class="t">${esc(title)}</span>
      ${sub ? `<span class="sub">${esc(sub)}</span>` : ""}
    </div>`;
  }

  function kpiRender(name, s, decimals, suffix) {
    if (!s || s.value == null) return `<div class="kpi"><div class="name">${esc(name)}</div><div class="val">—</div><div class="chg">&nbsp;</div></div>`;
    const v = parseFloat(String(s.value).replace(/[\s,]/g, ""));
    const dec = decimals != null ? decimals : 2;
    const valStr = isNaN(v) ? esc(s.value) : v.toLocaleString("ko-KR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
    const d = s.delta_pp;
    let chgHtml = "&nbsp;";
    if (d != null && d !== "" && !isNaN(Number(d))) {
      const dn = Number(d);
      if (Math.abs(dn) < 1e-9) chgHtml = `<span style="color:rgba(255,255,255,.55)">~0.00${suffix === "%" ? "%p" : ""}</span>`;
      else if (dn > 0) chgHtml = `<span style="color:#f87171">▲ ${Math.abs(dn).toFixed(dec)}${suffix === "%" ? "%p" : ""}</span>`;
      else             chgHtml = `<span style="color:#60a5fa">▼ ${Math.abs(dn).toFixed(dec)}${suffix === "%" ? "%p" : ""}</span>`;
    }
    const spark = (Array.isArray(s.spark) && s.spark.length >= 2)
      ? `<div class="kpi-spark">${sparkline(s.spark, trendForSpark(s), 80, 16)}<div class="period">${esc(sparkFoot(s))}</div></div>` : "";
    return `<div class="kpi"><div class="name">${esc(name)}</div><div class="val num">${valStr}${suffix ? `<span class="u">${esc(suffix)}</span>` : ""}</div><div class="chg">${chgHtml}</div>${spark}</div>`;
  }

  fetch("data.json?v=" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("data.json 응답 오류 (" + r.status + ")"); return r.json(); })
    .then(data => {
      $("error").style.display = "none";
      const s = data.series || {};
      const ga = data.generated_at || "";
      $("generated").textContent = ga.length >= 10 ? ga.slice(0, 10) : "—";

      // ── KPI 3종
      $("kpis").innerHTML =
        kpiRender("기준금리",  s.kr_policy_rate, 2, "%") +
        kpiRender("원/달러",   s.fx_usd,         2, "원") +
        kpiRender("국고채 3년", s.kr_gov_3y,     2, "%");

      // ── 한국 금리
      $("card-kr").innerHTML =
        cardHead("blue", "landmark", "한국 금리", "Korea Rates") +
        rateRow("기준금리",     s.kr_policy_rate, 2) +
        rateRow("국고채 3년",   s.kr_gov_3y,      2) +
        rateRow("국고채 5년",   s.kr_gov_5y,      2) +
        rateRow("CD 91일",     s.cd_91,           3) +
        rateRow("콜금리(1일)",  s.call_rate,      3);

      // ── 환율·시장 (KOSPI 포함)
      $("card-fx").innerHTML =
        cardHead("amber", "banknote", "환율·시장", "FX · KOSPI") +
        fxRow("코스피", s.kospi, 2) +
        fxRow("원/달러", s.fx_usd, 2) +
        fxRow("원/100엔", s.fx_jpy, 2) +
        fxRow("원/유로", s.fx_eur, 2);

      // ── 미국 금리 (yfinance 공식 미국채 수익률)
      $("card-us").innerHTML =
        cardHead("violet", "dollar-sign", "미국 금리", "US Rates") +
        fxRow("원/달러",         s.fx_usd,       2) +
        rateRow("기준금리",      s.us_policy,    2) +
        rateRow("국채 3개월",    s.us_t3m,       2) +
        rateRow("국채 10년",     s.us_t10y,      2) +
        rateRow("ECB 정책금리",  s.ecb_rate,     2);

      // ── 일본 금리
      $("card-jp").innerHTML =
        cardHead("rose", "japanese-yen", "일본 금리", "JP Rates") +
        fxRow("원/100엔", s.fx_jpy, 2) +
        rateRow("기준금리", s.jp_policy, 2) +
        rateRow("장기금리(≈10Y)", s.jp_long, 2);

      // ── 반도체
      $("card-semi").innerHTML =
        cardHead("violet", "cpu", "반도체", "Semiconductors") +
        fxRow("필라델피아 반도체", s.sox,      2) +
        fxRow("삼성전자",          s.samsung,  0) +
        fxRow("SK\n하이닉스",      s.sk_hynix, 0);

      // ── 부동산·산업용
      $("card-reit").innerHTML =
        cardHead("teal", "building-2", "부동산·산업용", "REITs · Industrial") +
        fxRow("KODEX 부동산리츠인프라", s.kr_reit_etf, 0) +
        fxRow("ESR켄달스퀘어(물류)",    s.esr_kendall, 0) +
        fxRow("Prologis(글로벌 산업용)", s.prologis,    2);

      // ── 주거용 부동산
      $("card-res").innerHTML =
        cardHead("green", "home", "부동산·주거용", "Residential") +
        fxRow("아파트 매매가격지수", s.apt_sale_idx,  2) +
        fxRow("아파트 전세가격지수", s.apt_lease_idx, 2) +
        rateRow("전세가율",           s.jeonse_ratio,  2);

      // ── 상업용 부동산
      $("card-com").innerHTML =
        cardHead("amber", "store", "부동산·상업용", "Commercial") +
        fxRow("KODEX 건설",           s.kr_construction, 0) +
        fxRow("iShares US 부동산",    s.us_realestate,   2) +
        fxRow("Vanguard 부동산(VNQ)", s.us_vnq,          2);

      // ── 물가
      $("card-prices").innerHTML =
        cardHead("teal", "trending-up", "물가 지수", "Prices · 2020=100") +
        idxRow("생산자물가(PPI)", s.ppi) +
        idxRow("수출물가",        s.export_px);

      // ── 건축·공급 (ECOS 물량지표)
      $("card-build").innerHTML =
        cardHead("blue", "hard-hat", "건축·공급", "Construction") +
        fxRow("미분양주택(전국)", s.unsold_homes,   0) +
        fxRow("건축착공 연면적",  s.building_start, 1);

      if (typeof lucide !== "undefined") lucide.createIcons();
    })
    .catch(e => {
      const err = $("error");
      err.style.display = "block";
      $("generated").textContent = "";
      if (location.protocol === "file:") {
        err.innerHTML = "<b>로컬 파일로 연 상태입니다.</b> 브라우저 보안 때문에 <code>data.json</code>을 불러올 수 없습니다. 프로젝트 루트에서 <code>python serve_docs.py</code> 실행 후 <b>http://127.0.0.1:8765/index.html</b> 을 여세요.";
      } else {
        err.textContent = "데이터를 불러오지 못했습니다 — " + (e && e.message ? e.message : e);
      }
    });
})();
</script>
</body>
</html>
